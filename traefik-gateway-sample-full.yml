apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.io
    chart: traefik
    targetRevision: 34.0.0 # Pin to your targeted stable production version
    helm:
      values: |
        deployment:
          replicas: 3
          tolerations:
          - key: "workload-type"
            operator: "Equal"
            value: "regular"
            effect: "NoSchedule"
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["traefik"]
                topologyKey: "kubernetes.io/hostname"
        providers:
          kubernetesGateway:
            enabled: true # Triggers the creation of the 'traefik' GatewayClass
        logs:
          general:
            level: ERROR # Production standard to reduce I/O and disk bloat
  destination:
    server: https://default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-prod-gateway
  namespace: traefik
spec:
  # References the Traefik GatewayClass
  gatewayClassName: traefik
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.example.com" # Production best practice: Explicit hostname scoping
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: traefik-prod-tls
    allowedRoutes:
      namespaces:
        from: Same

--- 
# using ACM certificates
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-prod-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik
  infrastructure:
    annotations:
      # Tell the AWS Controller to provision an external NLB
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
      # Link your ACM Certificate
      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:123456789012:certificate/your-acm-uuid-here"
      # Force AWS to encrypt public 443, routing it to internal port 80
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
  listeners:
  - name: https-via-acm
    protocol: HTTP # Decrypted at the AWS edge, enters the cluster as HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: ["backend-apps", "frontend-apps"]

