apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-prod-gateway
  namespace: istio-ingress
  labels:
    istio.io/gateway-name: istio-prod-gateway
spec:
  # References the built-in Istio GatewayClass
  gatewayClassName: istio
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*example.com"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: prod-tls-cert
    allowedRoutes:
      namespaces:
        from: Same # Production security: Only routes in istio-ingress allowed

---
# using ACM certificates
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-prod-gateway
  namespace: istio-ingress
  annotations:
    # 1. Force the AWS Load Balancer Controller to provision an NLB
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    
    # 2. Attach your exact AWS ACM Certificate ARN to the external balancer
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:123456789012:certificate/your-acm-uuid-here"
    
    # 3. Tell AWS to map public port 443 (HTTPS) to the Istio backend port 80 (HTTP)
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
spec:
  gatewayClassName: istio
  listeners:
  # The external user hits HTTPS (443), but the NLB offloads it and speaks HTTP to Istio
  - name: https-via-acm
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: ["backend-apps", "frontend-apps"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-api-route
  namespace: backend-apps # Isolated team namespace
spec:
  parentRefs:
  - name: istio-prod-gateway
    namespace: istio-ingress # Binds to the central platform gateway
  hostnames:
  - "api.example.com" # Explicit subdomain for the backend team
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: api-service
      port: 8080

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-dashboard-route
  namespace: frontend-apps # Isolated team namespace
spec:
  parentRefs:
  - name: istio-prod-gateway
    namespace: istio-ingress # Binds to the exact same central gateway
  hostnames:
  - "dashboard.example.com" # Explicit subdomain for the frontend team
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: dashboard-ui-service
      port: 80




