# Argo CD Application to install AWS Load Balancer Controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awsalb-load-balancer-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io 
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: networking
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.3.0
    helm:
      releaseName: aws-load-balancer-controller
      values: |
        clusterName: cluster-lab-13

        region: us-east-1

        # best practices, instead of tags
        vpcId: vpc-0306773f3fcfd0163

        controllerConfig:
          featureGates:
            NLBGatewayAPI: false
            ALBGatewayAPI: false

        enableShield: true
        # enableWaf: true
        enableWafv2: true

        serviceMonitor:
          enabled: true

        ingressGroup:
          name: devops-group

        nameOverride: awsalb-load-balancer-controller

        replicaCount: 3

        autoscaling:
          enabled: true
          minReplicas: 3
          maxReplicas: 4
          targetCPUUtilizationPercentage: 80

        serviceAccount:
          name: awsalb-load-balancer-controller-sa
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::722249351142:role/AmazonEKSLoadBalancerControllerRole-cluster-lab-13

        tolerations: 
          - key: "workload-type"
            operator: "Equal"
            value: "regular"
            effect: "NoSchedule"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
