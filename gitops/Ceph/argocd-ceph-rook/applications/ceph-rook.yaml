apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-rook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rook/rook.git
    path: deploy/charts/rook-ceph
    targetRevision: v1.13.4
    helm:
      releaseName: rook-ceph
      values: |
        crds:
          enabled: true
        csi:
          enableRbdDriver: true
          enableCephfsDriver: true
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
