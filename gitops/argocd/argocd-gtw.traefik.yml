apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-prod-gateway-itsnotrocketscience
  namespace: gateway-infra
spec:
  gatewayClassName: traefik
  listeners:
  - name: https
    protocol: HTTP # Correct: Bypasses local crypto since ACM handles it at the AWS edge
    port: 8000 # matches traefik specs for web
    hostname: "*.itsnotrocketscience.tech"
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gateway-access: "traefik-prod-gateway"
  - name: http
    protocol: HTTP
    port: 8080
    hostname: "*.itsnotrocketscience.tech"
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gateway-access: "traefik-prod-gateway"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-gateway-route
  namespace: argocd
spec:
  parentRefs:
  - name: traefik-prod-gateway-itsnotrocketscience
    namespace: gateway-infra
    sectionName: https
  hostnames:
  - "argocd.itsnotrocketscience.tech"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
      - name: argocd-server
        namespace: argocd
        port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: global-http-to-https-redirect
  namespace: argocd
spec:
  parentRefs:
  - name: traefik-prod-gateway-itsnotrocketscience
    namespace: gateway-infra
    sectionName: http # <-- Only targets the plain HTTP port 8080 listener
  hostnames:
  - "argocd.itsnotrocketscience.tech" # Can be a wildcard to upgrade all subdomains globally
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https   # Upgrades the scheme to https
        statusCode: 301 # Permanent redirect
---
