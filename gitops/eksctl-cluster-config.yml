apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cluster-lab-13
  region: us-east-1
  version: "1.33"
  tags:
    environment: staging
    team: platform
    karpenter.sh/discovery: cluster-lab-13
    karpenter.sh/managed-by: "team-h"
    k8s.io/cluster-autoscaler/cluster-lab-13: owned

vpc:
  manageSharedNodeSecurityGroupRules: true

addons:
  - name: coredns
    version: latest
    configurationValues: |
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "core"
          effect: "NoSchedule"
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
  - name: kube-proxy
    version: latest
  - name: eks-pod-identity-agent
    version: latest 
  # # provisioned via terraform, due to limitations of configurationValues tolerations, afinity et
  # - name: aws-ebs-csi-driver
  #   version: latest
  #   serviceAccountRoleARN: arn:aws:iam::722249351142:role/AmazonEKS_EBS_CSI_DriverRole-cluster-lab-13
  - name: vpc-cni
    version: latest 
  - name: metrics-server
    version: v0.7.2-eksbuild.4
    configurationValues: |
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "core"
          effect: "NoSchedule"
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

iam:
  withOIDC: true

managedNodeGroups:
  - name: linux-nodes-13
    instanceTypes: ["m5.large"]
    # instanceTypes: ["m5.large", "t3.medium"]
    # spot: true
    desiredCapacity: 1
    minSize: 1
    maxSize: 4
    volumeSize: 40
    maxPodsPerNode: 110
    iam:
      instanceRoleARN: arn:aws:iam::722249351142:role/eksctl-cluster-lab-13-nodegroup-linu-NodeInstanceRole
    labels:
      cluster-autoscaler-enabled: "true"
      nodegroup: worker-nodes-core
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/cluster-lab-13: owned
    taints:
      - key: "workload-type"
        value: "core"
        effect: "NoSchedule"
      - key: "CriticalAddonsOnly"
        value: "true"
        effect: "NoSchedule"
  - name: linux-nodes-13-2
    instanceTypes: ["m5.large", "t3.medium"]
    desiredCapacity: 2
    minSize: 2
    maxSize: 6
    volumeSize: 40
    maxPodsPerNode: 110
    iam:
      instanceRoleARN: arn:aws:iam::722249351142:role/eksctl-cluster-lab-13-nodegroup-linu-NodeInstanceRole
    labels:
      cluster-autoscaler-enabled: "true"
      nodegroup: worker-nodes-regular
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/cluster-lab-13: owned
    taints:
      - key: "workload-type"
        value: "regular"
        effect: "NoSchedule"