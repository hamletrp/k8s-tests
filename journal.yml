🔧 1. Principles of Advanced Infrastructure Automation
    Immutable Infrastructure: Rebuild rather than mutate servers. E.g., replace EC2 instances via auto scaling groups instead of patching in place.
    Idempotency: Repeated automation runs should always produce the same result (e.g., using Terraform, Ansible).
    Declarative over Imperative: Describe what you want (e.g., Kubernetes manifests, Terraform code), not how to do it.
    GitOps: Use Git as the source of truth for infra & application states. Changes flow through PRs and sync tools (e.g., Argo CD, Flux).
    Event-Driven Automation: Trigger workflows based on events (e.g., new commit, tag push, image update, etc.).


