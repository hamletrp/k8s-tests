    - Differences between Deployment and StatefulSet 
    (stateless vs stateful workloads, persistent identities, volumes, 
    and deployment order).
        Differences between Deployment and StatefulSet - stateless vs stateful workloads
            Deployment and StatefulSet 
                differs by the type of workload they were designed for:
                    Deployment are design for stateless workloads (back evnt processors, microservices, apis)
                        where identity is random, storage is shared or ephemeral,
                        pods are interchangable, not START/SHUTDOWN order.
                        Use a clusterIP SVC and manage rolling updates during render.
                    differs from stateful workloads (databases, queues, key-value like redis)
                        where pods are not interchangable, 
                        have a persistent identity and storage, OREDERED start/shutdown, 
                        use a headless service and the scaling is predictable
                        


        Persistent identities
            By examples:
                - stateful pod names 
                - AWS IAM Role
                - K8s Service Account 
                - IRSA and EKS Pod Identity
            They live regardless of the lifecycle of other resources instances
            so they are logical identity that are assigned to a workload or a service 
            and that use short-lived credentials for authentication.
                - ServiceAccounts + IAM roles are the backbone
                - Enables zero-trust, least privilege, and automation
                - Fundamental to modern cloud-native security
        
        Deployment Order - #debugging 
            “Deployment order is about satisfying dependencies: 
                infrastructure and controllers first, 
                then configuration and RBAC, 
                then workloads, 
                and finally traffic. 
            and we do this recursively for each piece of deployment.
                Controllers before resources it reconciles 
                CRD before the resources to be used
                Secrets before apps
                live and Readiness probes before traffic


            - Every piece of deployment has dependencies, securities boundaries and compliance rules 
            that must be in-place prior to deploy, therefore each of these must be previously set,
            and this is applied recursively until a safe, clean deployment is achieve 
            A few example of these are:
                - The obvious one: Infa (nodes & node groups, vpc, subnets, IAM setups)
                    virtual cluster via namespaces prior to workloads. 
                !So we have a cluster!
                - The security layer: RBAC, Serv. Accounts, NetworkPolicies, ResourceQuotas
                - Storage classes prior to workloads that requires storage and volumes
                - A Controller/operator before the resources it reconciles
                    [Secrets Store CSI Driver] *SecretProviderClass 
                    [External Secrets Operator] *External Secrets Operator
                - CRDS before any resource that uses them 
                    [Argo CD] Application
                    [External Secrets] ExternalSecret
                    [VirtualService] VirtualService
                - Secrets and Configs before application uses them 
                - Readiness, livenes probes 
                - Services (ALB, Ingress) prior to be able to serve traffic
                - etc

