        - My way to think abut performance optimization and scaling setups 
          in order to handle real volume of transactions in a cluster 
            - Refer to one real world sample  
            1- We have a framework of work based one: 
                - Workload type, metrics and compute capacity 
                    APIs, req/res, streaming, async backlog (queues etc), INGRESS
                and there are standarized numbers that works based on the load 
            2- Which is my way to approach it based on these inputs:
                - FOCUS on the transaction workflow
                i.e hotpaths, kpi's measured transactions 
                and pinpoint the endpoints, async workers, handlers etc
                and optimize those within their isolated scope
                - PLUS doing the same for all related dependencies and dependee
                and more important on the point where these workload overlap.
                  AND flag these as critical, for proper scheduling.
            PARAMOUNT:
                - To determine the load a process/pod can handle avoiding 
                cpu/memory saturation
                    If cap is 50 in-flight per pod, set autoscaling to maintain headroom, e.g.:
                        •	target 30–40 in-flight per pod, not 50
                            Autoscaling gets time to react
                        •	that way you scale out before you hit overload

        - capping in-flight reduces #TAIL-LATENCY
            When concurrency gets too high on one pod:
                •	Timeouts/retries kick in → extra traffic → positive feedback loop
                •   So p50 might look “okay” while p99 goes feral.

                recursive dependencies - OPTIMIZATION first
                    Pick the bottleneck and set a safe pod budget

                PROTECT LATENCY
                    concurrency limiter middleware (semaphore)
                        “Only N requests are allowed to execute at the same time.
                            Everyone else must wait briefly or fail fast.”

            #TAIL-LATENCY
            Where to enforce the cap in-flight:
                You can cap in 3 places (often you do 2 of them):
                    1) Inside the app (most precise)
                        Node.js REST
                            •	Use a semaphore / concurrency limiter middleware.
                            •	If full: return 429 or 503, ideally with Retry-After.
                        gRPC
                            •	Limit max concurrent RPC handlers (semaphore around handlers).
                            •	For streaming, limit active streams separately.

                        A cap keeps the system in the “stable region”: less queueing, fewer timeouts, fewer retries.

                    2) At the proxy/ingress/mesh (fast protection)
                        •	Envoy/Istio/NGINX can cap:
                        •	max requests in-flight
                        •	max connections
                        •	circuit breaking / outlier detection
                        •	Great for “shielding” pods from bursts.

                    3) At the dependency boundary, DownStream|UpStream (DB pool is an implicit cap)
                        •	DB connection pool size is a hard ceiling.
                        •	If your in-flight cap exceeds pool capacity, you’ll just create queueing inside the app.

            #TAIL-LATENCY
            Setup guideline (practical steps)
                Step 1: Pick the bottleneck and set a safe pod budget

                Common starting points per pod:
                    •	CPU-bound API: in-flight ≈ 2–5 × vCPU
                    •	I/O-heavy API (DB calls): in-flight ≈ 1–2 × DB pool size
                    •	gRPC streaming: cap streams, not just requests
                If you don’t know yet, start conservative (e.g., 50 inflight/pod) and tune.

                If cap is 50 in-flight per pod, set autoscaling to maintain headroom, e.g.:
                    •	target 30–40 in-flight per pod, not 50
                    •	that way you scale out before you hit overload

            #TAIL-LATENCY
            ORDERED OPTIMIZATION 
                * Circuit breaking buys time for autoscaling to work.
                - Service mesh Shields pods from bursts
                    e.g - CircuitBreaking: DestinationRule:
                            trafficPolicy:
                                connectionPool: 200
                    e.g: 
                        and a VirtualService:
                            Timeouts + retry policy
                - HPA/KEDA to Add capacity before cap is hit
                - Concurrency limitter Protects handler & dependencies
                - DB connection pool Protects database

                RESULT: 
                    •	Circuit breaking happens at the envoy proxy / service mesh
                    •	Requests are rejected early
                    •	Clients see fast failures
                    •	Pods are shielded
                    •	Autoscaling gets time to react
                            
