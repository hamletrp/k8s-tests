        Linux troubleshooting tools
            System Monitoring Tools
                - free
                    RAM and swap usage; quick snapshot of memory pressure.
                    free -h 
                - vmstat
                    virtual memory, processes, CPU, I/O,
                    vmstat 1
                - mpstat
                    CPU usage per core (part of sysstat package)
                    mpstat -P ALL 1
            Network Diagnostics Tools
                - netstat
                    open ports, active connections, routing tables
                    netstat -tuln
                - ping
                    ICMP echo packets to test reachability + latency.
                    ping google.com
                - traceroute
                    network path (hops) to a destination
                    traceroute github.com
                - telnet 
                    TCP connectivity to a host and port
                    telnet example.com 443
                - tcpdump
                    network traffic packets for inspection
                    tcpdump -i eth0 port 80
                    nc -vz redis.myapp.svc.cluster.local 6379


                | Problem Type             | Recommended Tool        |
                | ------------------------ | ----------------------- |
                | RAM or swap exhaustion   | `free`, `vmstat`        |
                | CPU bottlenecks          | `mpstat`, `top`, `htop` |
                | Open ports or listening  | `netstat`, `ss`         |
                | Connectivity failure     | `ping`, `telnet`, `nc`, 'curl' 'nc -vz <host> <port>'  |
                | Trace route to service   | `traceroute`            |
                | Debug HTTP/HTTPS traffic | `tcpdump`, `wireshark`  |

        SLO (Service Level Objective) is a target reliability or performance goal that a service must meet 
            | SLI (metric)                                 | Typical SLO                        |
            | -------------------------------------------- | ---------------------------------- |
            | `http_request_duration_seconds`              | 95% of requests respond in < 500ms |
            | `container_cpu_usage_seconds_total`          | CPU usage < 80% over 10 minutes    |
            | `kube_pod_status_ready`                      | 99.9% of pods are ready            |
            | `apiserver_request_total` / error ratio      | < 0.1% error rate                  |
            | `etcd_debugging_mvcc_db_total_size_in_bytes` | etcd size < 80% of disk quota      |
            How Are SLOs Implemented?
                Define SLI → Metrics that represent the health of your service
                    (e.g. request latency, error rate, availability)                
                Set SLO thresholds → Acceptable target ranges
                    (e.g. 99.95% availability in 30 days)
                Create alerts or dashboards using:
                    Prometheus + Alertmanager
                    Grafana dashboards
