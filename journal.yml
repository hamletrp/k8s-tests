- Gremlin as a chaos engineering platform
    - Inject failures (e.g., CPU, memory, network) to uncover weaknesses
    - runs a lightweight agent on nodes or containers
    - Safe and reversible chaos, with scheduling and blast radius controls
    🧪 Sample Chaos Scenarios with Gremlin
        - CPU Attack/load attack: Simulate high CPU usage on a node to test autoscaling.
        - Latency Attack: Introduce 300ms latency on an API to test retry logic.
        - Kill Process Attack: Terminate nginx to test self-healing via K8s deployments.
        - Blackhole Attack: Drop all outgoing traffic to a database for X seconds.
    ✅ Benefits #key
        Find weaknesses before your users do
        Improve observability, alerting, and failover
        Build system confidence with game days and real-world testing

8️⃣ “Resource correctness” in practice (checklist)
    When someone says “we’ll review Kubernetes resource correctness”, they usually mean:
        🧩 Does everything validate against the API schema?
        🔗 Do labels/selectors glue resources together correctly?
        ⚙️ Are resource requests/limits & probes sensible?
        🔐 Are RBAC, securityContext, and NetworkPolicy sane?
        🔑 Are ConfigMaps/Secrets/env references correct?
        🚦 Is the rollout strategy safe (HPA, PDB, strategies)?

