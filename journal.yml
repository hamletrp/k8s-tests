    A polyglot system is one built with multiple prog languages, runtimes, frameworks,
    and data exists - tied together through:
        •	API contracts
        •	message buses
        •	RPC frameworks
        •	consistent DevOps tooling

    Why teams build polyglot systems
        •	Different workloads have different performance profiles
        •	No single language excels at everything
        •	Teams optimize for:
            •	compliance
            •	throughput
            •	latency
            •	developer productivity
            •	ecosystem maturity
    Typical polyglot stack (example)
        Layer	            Technology
        ======================================================
        APIs	                Java, Go, Node.js
        Streaming	            Kafka, Kinesis
        Batch	                Spark, Flink
        ML	                    Python
        Storage	                (RDS) Postgres, DynamoDB, S3
        Infra	                Terraform, Kubernetes
        Observability	         Prometheus, OpenTelemetry

    🚀 Hybrid Application Workflows
        A hybrid application workflow is a business or technical process 
        that spans multiple execution models, such as:
        •	synchronous calls (REST/gRPC)
        •	asynchronous events (pub/sub)
        •	background jobs / queues
        •	scheduled tasks
        •	human approvals / manual inputs
        •	state machines / orchestrators
        •	cloud services (Lambda, Step Functions, Workflows)

        In other words:
            One workflow that mixes sync + async + event-driven + batch + orchestration.
            It’s hybrid because it pulls together several workflow styles into a single cohesive flow.

    🧩 Why Hybrid Workflows Exist
        Real applications rarely fit one style. They often require:
            ✔ Immediate real-time responses → synchronous RPC / REST
            ✔ Long-running or retryable jobs → async queues
            ✔ System-to-system communication → events
            ✔ Coordination → orchestrators
            ✔ Human interaction → approvals, emails, dashboards
            ✔ Cloud-native integrations → serverless functions or APIs

            Combining them gives you resilience, scalability, and flexibility.

        Sample: Sync + Async + Event chaining
            User calls API - From WebApp || Mobile App
            → API stores data  
            → emits event  
            → multiple services react  
            → one of them triggers background job  
            → job emits completion event  
            → another service updates state

