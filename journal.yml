        | **Alert**                   | **Reason**                                                         |
        | --------------------------- | ------------------------------------------------------------------ |
        | `KubeAPIDown`               | API server is unreachable. Core functionality at risk.             |
        | `KubeSchedulerDown`         | Scheduler not running – workloads won’t be assigned.               |
        | `KubeControllerManagerDown` | Core controller not functioning – e.g., for deployments, replicas. |
        | `NodeDown`                  | Node is not Ready for over 5 minutes.                              |
        | `HighNumberOfNotReadyNodes` | More than 30% of nodes are not ready.                              |
        | `HighEtcdDiskUsage`         | etcd disk almost full – cluster could become unstable.             |

    2. Resource Pressure
        | **Alert**                       | **Reason**                                             |
        | ------------------------------- | ------------------------------------------------------ |
        | `NodeMemoryPressure`            | Memory near capacity.                                  |
        | `NodeDiskPressure`              | Disk usage high, may affect performance or crash pods. |
        | `KubeNodeHighCpuLoad`           | CPU load is very high. May affect pod scheduling.      |
        | `ContainerMemoryUsageNearLimit` | Container close to OOMKilled.                          |
        | `PodCrashLooping`               | Indicates app instability.                             |

    3. Workload Failures or desired state mismatch
        | **Alert**                         | **Reason**                                |
        | --------------------------------- | ----------------------------------------- |
        | `KubeDeploymentReplicasMismatch`  | Deployment desired ≠ available pods.      |
        | `KubeStatefulSetReplicasMismatch` | Same as above but for StatefulSets.       |
        | `KubeJobFailed`                   | Kubernetes Job failed to complete.        |
        | `KubePodNotReady`                 | Pod stuck in Pending or Init state.       |
        | `KubeDaemonSetRolloutStuck`       | DaemonSet cannot complete rolling update. |

    4. Security and Access
        | **Alert**                                 | **Reason**                    |
        | ----------------------------------------- | ----------------------------- |
        | `KubeNamespaceQuotaExceeded`              | Resource quota exceeded.      |
        | `RBACAccessDenied` (if logging supported) | Someone is denied via RBAC.   |
        | `ServiceAccountTokenErrors`               | Token expired or not mounted. |

    5. Network and Ingress  
        | **Alert**                | **Reason**                                                |
        | ------------------------ | --------------------------------------------------------- |
        | `KubeServiceDown`        | Service endpoints missing or not matching selectors.      |
        | `KubeIngressDown`        | Ingress not routing properly or failing readiness probes. |
        | `CoreDNSDown`            | DNS not resolving inside cluster.                         |
        | `KubeNetworkUnavailable` | Overlay or CNI failure.                                   |
    
    6. Prometheus Monitoring Itself
        | **Alert**                 | **Reason**                                 |
        | ------------------------- | ------------------------------------------ |
        | `PrometheusDown`          | Self-monitoring fails.                     |
        | `PrometheusTargetMissing` | Scrape target disappeared (e.g., Kubelet). |
        | `PrometheusRuleFailures`  | PromQL rules failing to evaluate.          |


