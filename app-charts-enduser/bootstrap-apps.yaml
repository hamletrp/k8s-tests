apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: webapps-main
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters: {}
          - list:
              elements:
                - appName: webapp1
                  namespace: webapps-dev
                  env: dev
                  type: helm
                  repoURL: https://github.com/hamletrp/k8s-tests.git
                  targetRevision: cluster-lab-13
                  path: "app-charts-enduser/charts/{{appName}}"
                - appName: kustom-webapp1
                  namespace: kusapp-dev
                  env: dev
                  type: kustomize
                  repoURL: https://github.com/hamletrp/k8s-tests.git
                  targetRevision: cluster-lab-13
                  path: "app-charts-enduser/charts/{{appName}}/overlays/{{env}}"
  template:
    metadata:
      name: "{{appName}}-{{env}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
    spec:
      project: default
      source:
        repoURL: "{{repoURL}}"
        targetRevision: "{{targetRevision}}"
        path: "{{path}}"
      destination:
        server: '{{server}}'
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      '{{- if eq .type "helm" }}'
      source:
        helm:
          releaseName: "{{appName}}-{{env}}"
          valueFiles:
          - "values.yaml"
          - "values-{{env}}.yaml"
      '{{- end }}'