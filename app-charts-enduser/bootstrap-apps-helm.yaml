apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: webapps-helm-main
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters: {}
          - list:
              elements:
                # - appName: gradeapp
                #   namespace: gradeapp-dev
                #   env: dev
                #   repoURL: https://github.com/hamletrp/k8s-tests.git
                #   targetRevision: cluster-lab-13
                - appName: gradeapp
                  namespace: gradeapp-prod
                  env: prod
                  repoURL: https://github.com/hamletrp/k8s-tests.git
                  targetRevision: cluster-lab-13
                # - appName: webapp1
                #   namespace: webapps-dev
                #   env: dev
                #   repoURL: https://github.com/hamletrp/k8s-tests.git
                #   targetRevision: cluster-lab-13
                # - appName: webapp1
                #   namespace: webapps-prod
                #   env: prod
                #   repoURL: https://github.com/hamletrp/k8s-tests.git
                #   targetRevision: cluster-lab-13
  template:
    metadata:
      name: "{{appName}}-{{env}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
    spec:
      project: default
      source:
        repoURL: "{{repoURL}}"
        targetRevision: "{{targetRevision}}"
        path: "app-charts-enduser/charts/{{appName}}"
        helm:
          releaseName: "{{appName}}-{{env}}"
          valueFiles:
          - "values.yaml"
          - "values-{{env}}.yaml"
      destination:
        server: '{{server}}'
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true