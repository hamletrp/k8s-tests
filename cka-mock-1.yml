Steps upgrading an existing node:
    - from control plane: k drain <nodename> --ignore-daemonsets --delete-emptydir-data
    - ssh into the node 
    - update kubeadm, kubelet, kubectl to the same version as control plane
      sudo apt-get update && sudo apt-get install -y --allow-change-held-packages kubeadm=1.35.2-1.1 kubelet=1.35.2-1.1
    - execute upgrade:
      sudo systemctl daemon-reload
      sudo systemctl restart kubelet
      sudo kubeadm upgrade node
    - from control plane: kubectl uncordon <nodename>

Steps adding a new node to cluster - just need to match the version:
    - note master node version 
    - kubeadm token create --print-join-command
    - note both
    - export VER=v1.35.2-1.1
    - sudo apt-get update
    - sudo apt-get install -y kubeadm=$VER kubelet=$VER kubectl=$VER --allow-change-held-packages
    - sudo systemctl daemon-reload && sudo systemctl enable kubelet && sudo systemctl start kubelet
    - run join command 
    - check node is ready - from master 

