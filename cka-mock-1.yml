---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: cka5673
spec:
  gatewayClassName: nginx
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: kodekloud.com
      tls:
        certificateRefs:
          - name: kodekloud-tls

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: cka7395
spec:
  parentRefs:
  - name: nginx-gateway
    namespace: nginx-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: api-service
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: web-service
      port: 80

--- weighted 
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-weighted-route
  namespace: gateway-infra
spec:
  # Links the route directly to your internet-facing NGINX Gateway
  parentRefs:
    - name: nginx-gateway-doordress
      namespace: gateway-infra
      sectionName: https
  hostnames:
    - "shop.doordress.us"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: / # Captures all paths under the same route boundary
      backendRefs:
        # 1. Primary/Stable Version Target (90% of traffic)
        - name: shop-service-v1
          port: 80
          weight: 90
        
        # 2. Canary/Experimental Version Target (10% of traffic)
        - name: shop-service-v2
          port: 80
          weight: 10


