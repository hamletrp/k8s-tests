--- weighted 
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-weighted-route
  namespace: gateway-infra
spec:
  # Links the route directly to your internet-facing NGINX Gateway
  parentRefs:
    - name: nginx-gateway-doordress
      namespace: gateway-infra
      sectionName: https
  hostnames:
    - "shop.doordress.us"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: / # Captures all paths under the same route boundary
      backendRefs:
        # 1. Primary/Stable Version Target (90% of traffic)
        - name: shop-service-v1
          port: 80
          weight: 90
        
        # 2. Canary/Experimental Version Target (10% of traffic)
        - name: shop-service-v2
          port: 80
          weight: 10


