apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traffic-director
  namespace: default
spec:
  parentRefs:
  - name: my-gateway
  hostnames:
  - "r500.gateway"  # Replicated host configuration from your old Ingress
  rules:
  # 1. New Extended Rule: Route /auto based on User-Agent header
  - matches:
    - path:
        type: Exact
        value: /auto
      headers:
      - name: User-Agent
        value: mobile
    backendRefs:
    - name: mobile-backend
      port: 80

  - matches:
    - path:
        type: Exact
        value: /auto
    backendRefs:
    - name: desktop-backend  # Fallback for non-mobile User-Agents hitting /auto
      port: 80

  # 2. Legacy Replicated Rule: Standard default route from old Ingress
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: main-backend
      port: 80


---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-backend
  namespace: project-snake
spec:
  podSelector:
    matchLabels:
      app: backend  # 1. This policy attaches to and controls the backend pods
  policyTypes:
  - Egress          # 2. Controls outbound connections leaving the backend pods
  egress:
  # Rule A: Allow backend to talk to db1 on port 1111
  - to:
    - podSelector:
        matchLabels:
          app: db1
    ports:
    - protocol: TCP
      port: 1111
  # Rule B: Allow backend to talk to db2 on port 2222
  - to:
    - podSelector:
        matchLabels:
          app: db2
    ports:
    - protocol: TCP
      port: 2222

