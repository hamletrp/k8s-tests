apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: main
  namespace: argocd
spec:
  generators:
  - list:
      elements:
        - appName: loki-stack
          namespace: logging
          chart: loki-stack
          repoURL: https://grafana.github.io/helm-charts
          targetRevision: 2.10.2
          valuesFile: app-charts/loki-stack/values-prod.yaml
        # - appName: ingress-nginx
        #   namespace: ingress-nginx
  template:
    metadata:
      name: "{{appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
    spec:
      project: default
      sources:
        - chart: "{{chart}}"
          repoURL: "{{repoURL}}"
          targetRevision: "{{targetRevision}}"
          helm:
            releaseName: "{{appName}}"
            valueFiles:
              # - $values/app-charts/loki-stack/values-prod.yaml
              - $values/{{valuesFile}}
        - repoURL: https://github.com/hamletrp/k8s-tests.git
          targetRevision: cluster-lab-13
          ref: values 
      destination:
        name: in-cluster
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true