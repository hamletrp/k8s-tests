apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: main
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters: {}
          - list:
              elements:
                - appName: stakater-reloader
                  namespace: core-system
                  chart: reloader
                  repoURL: https://stakater.github.io/stakater-charts
                  targetRevision: 2.1.4
                  valuesFile: app-charts/stakater-reloader/values-prod.yaml
                - appName: loki-stack
                  namespace: logging
                  chart: loki-stack
                  repoURL: https://grafana.github.io/helm-charts
                  targetRevision: 2.10.2
                  valuesFile: app-charts/loki-stack/values-prod.yaml
                - appName: cert-manager
                  namespace: cert-manager
                  chart: cert-manager
                  repoURL: https://charts.jetstack.io
                  targetRevision: v1.17.2
                  valuesFile: app-charts/cert-manager/values-prod.yaml
  template:
    metadata:
      name: "{{appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
    spec:
      project: default
      sources:
        - chart: "{{chart}}"
          repoURL: "{{repoURL}}"
          targetRevision: "{{targetRevision}}"
          helm:
            releaseName: "{{appName}}"
            valueFiles:
              - $values/{{valuesFile}}
        - repoURL: https://github.com/hamletrp/k8s-tests.git
          targetRevision: cluster-lab-13
          ref: values 
      destination:
        server: '{{server}}'
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true